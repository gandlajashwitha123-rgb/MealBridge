<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MealBridge | Incoming Requests</title>
  <link rel="stylesheet" href="css/ngo.css">
</head>

<body>
  <header class="topbar">
    <a class="brand" href="mess-dashboard.html">🍱 MealBridge</a>

    <nav>
      <a href="mess-dashboard.html">Dashboard</a>
      <a href="post-food.html">Post Food</a>
      <a class="active" href="mess-requests.html">Incoming Requests</a>
      <button type="button" id="logoutBtn" class="logout">
        Logout
      </button>
    </nav>
  </header>

  <main class="container">
    <section class="welcome">
      <div>
        <p class="eyebrow">MESS STAFF PORTAL</p>
        <h1>Incoming Food Requests 📬</h1>
        <p>Review NGO requests and arrange food pickups.</p>
      </div>
      <div class="welcome-icon">🤝</div>
    </section>

    <section class="section-heading">
      <div>
        <h2>Requests from NGOs</h2>
        <p>Accept or reject each request and assign pickup time.</p>
      </div>
      <button type="button" class="primary-btn" id="refreshBtn">
        ↻ Refresh
      </button>
    </section>

    <div id="message" class="message" hidden></div>

    <section id="requestList" class="request-list">
      <p class="empty">Loading requests...</p>
    </section>
  </main>

  <footer>
    © 2026 MealBridge · Every rescued meal matters 💚
  </footer>

  <script>
    document.getElementById("logoutBtn").addEventListener("click", function () {
      localStorage.removeItem("token");
      localStorage.removeItem("user");
      sessionStorage.clear();
      window.location.assign("login.html");
    });
  </script>

  <script src="js/mess-requests.js"></script>
</body>
</html>
