<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | MealBridge</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/auth.css">

</head>


<body class="auth-body">


<div class="auth-wrapper">


    <div class="auth-brand">

        <a href="index.html">

            🍱 <strong>MealBridge</strong>

        </a>

        <p>

            Save food. Share hope. ❤️

        </p>

    </div>


    <div class="auth-card">


        <div class="auth-header">

            <span class="auth-icon">👋</span>

            <h1>Welcome Back!</h1>

            <p>Login to continue your journey.</p>

        </div>


        <form id="loginForm">


            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <div id="loginMessage"
                 class="message">

            </div>


            <button type="submit"
                    class="auth-button">

                Login →

            </button>


        </form>


        <div class="auth-divider">

            <span>New to LeftoverLink?</span>

        </div>


        <a href="register.html"
           class="secondary-button">

            Create an Account

        </a>


        <a href="index.html"
           class="back-home">

            ← Back to Home

        </a>


    </div>


</div>


<script src="js/auth.js"></script>

</body>

</html>
