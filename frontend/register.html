<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | LeftoverLink</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/auth.css">

</head>


<body class="auth-body">


<div class="auth-wrapper">


    <div class="auth-brand">

        <a href="index.html">

            🍱 <strong>MealBridge</strong>

        </a>

        <p>

            Join the food rescue movement. 🌱

        </p>

    </div>


    <div class="auth-card register-card">


        <div class="auth-header">

            <span class="auth-icon">🌱</span>

            <h1>Create Account</h1>

            <p>Be part of something meaningful.</p>

        </div>


        <form id="registerForm">


            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label>Phone Number</label>

                <input
                    type="tel"
                    id="registerPhone"
                    placeholder="10-digit phone number"
                    required
                >

            </div>


            <div class="form-group">

                <label>I am joining as</label>

                <select id="registerRole"
                        required>

                    <option value="">
                        Select your role
                    </option>

                    <option value="mess">
                        🍳 Mess Staff
                    </option>

                    <option value="ngo">
                        🤝 NGO
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Minimum 6 characters"
                    required
                >

            </div>


            <div class="form-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter password"
                    required
                >

            </div>


            <div id="registerMessage"
                 class="message">

            </div>


            <button type="submit"
                    class="auth-button">

                Create Account →

            </button>


        </form>


        <p class="login-link">

            Already have an account?

            <a href="login.html">

                Login

            </a>

        </p>


        <a href="index.html"
           class="back-home">

            ← Back to Home

        </a>


    </div>


</div>


<script src="js/auth.js"></script>

</body>

</html>
